services:
  # PostgreSQL with pgvector extension enabled
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/migrations:/docker/migrations:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-helpdesk}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - helpdesk_network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.26.0
    container_name: helpdesk_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_secure_password}
      NEO4J_server_bolt_advertised__address: ":${NEO4J_BOLT_PORT:-7687}"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474" # Web Browser UI
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - helpdesk_network

  # Automated Knowledge Ingestion & Seeding Service (Postgres pgvector + Neo4j)
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk_seed
    command: [ "python", "scripts/seed.py" ]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-helpdesk}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-helpdesk}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_secure_password}
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./src/data:/app/data:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./docker:/app/docker:ro
      - ./eval:/app/eval:ro
      - ./.env.example:/app/.env.example:ro
      - ./.gitattributes:/app/.gitattributes:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./README.md:/app/README.md:ro
      - ./requirements.txt:/app/requirements.txt:ro
    networks:
      - helpdesk_network

  # HelpDesk Lite Application (Chainlit + LangGraph)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk_app
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-helpdesk}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-helpdesk}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_secure_password}
      - PYTHONPATH=/app
      - APP_PORT=${APP_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    volumes:
      - ./chainlit.md:/app/chainlit.md:ro
      - ./src:/app/src:ro
      - ./src/data:/app/data:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./docker:/app/docker:ro
      - ./eval:/app/eval:ro
      - ./.env.example:/app/.env.example:ro
      - ./.gitattributes:/app/.gitattributes:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./README.md:/app/README.md:ro
      - ./requirements.txt:/app/requirements.txt:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - helpdesk_network

networks:
  helpdesk_network:
    name: helpdesk_network
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:

